[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "beatnull"
version = "0.1.0"
description = "Does your closed-loop result beat its controls? Block-level permutation tests, order-confound checks and pre-registered plans for closed-loop experiments."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Arihanth Mutha" }]
keywords = ["statistics", "permutation-test", "biocomputing", "neuroscience", "closed-loop", "pre-registration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
paper = ["matplotlib>=3.8"]

[project.scripts]
beatnull = "beatnull.cli:main"

[project.urls]
Homepage = "https://github.com/Arihanth-Mutha/beatnull"

[tool.hatch.build.targets.wheel]
packages = ["src/beatnull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: statistical calibration tests (many simulated experiments)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B905"]
